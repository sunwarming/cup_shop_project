{% extends 'shop/base.html' %}
{% block title %}Каталог кружек | CupStore{% endblock %}

{% block content %}
<div class="container">
    <div class="row">
        <div class="col-md-3 mb-4">
            <div class="card p-3 shadow-sm bg-white">
                <h4 class="mb-3 fw-bold"><i class="bi bi-sliders"></i> Фильтры</h4>
                <form id="filter-form">
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Поиск по названию</label>
                        <input type="text" id="search-input" class="form-control" placeholder="Например: Кружка C++">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Категория</label>
                        <select id="category-select" class="form-select">
                            <option value="">Все категории</option>
                            {% for cat in categories %}
                                <option value="{{ cat.id }}">{{ cat.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-semibold">Производитель</label>
                        <select id="manufacturer-select" class="form-select">
                            <option value="">Все производители</option>
                            {% for man in manufacturers %}
                                <option value="{{ man.id }}">{{ man.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <button type="submit" class="btn btn-warning w-100 fw-bold">Применить фильтры</button>
                </form>
            </div>
        </div>

        <div class="col-md-9">
            <div id="loading-spinner" class="text-center my-5">
                <div class="spinner-border text-warning" style="width: 3rem; height: 3rem;" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
                <p class="mt-2 text-muted">Ищем самые красивые кружки...</p>
            </div>

            <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

            <div id="products-grid" class="row row-cols-1 row-cols-sm-2 row-cols-lg-3 g-4">
                </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
{% load static %}
<script src="{% static 'js/main.js' %}"></script>
{% endblock %}
