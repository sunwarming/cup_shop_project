<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Оформление заказа</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f9f9f9; }
        .checkout-container { max-width: 600px; background: white; padding: 25px; border: 1px solid #ddd; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: bold; }
        .form-group input, .form-group textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        .btn-confirm { background-color: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%; }
        .btn-confirm:hover { background-color: #0056b3; }
        ul { padding-left: 20px; color: #555; }
    </style>
</head>
<body>

    <div class="checkout-container">
        <h2>Оформление заказа</h2>
        <p><a href="{% url 'cart_view' %}">← Вернуться в корзину</a></p>
        <hr>
        
        <h4>Ваш заказ:</h4>
        <ul>
            {% for item in cart_items %}
                <li>{{ item.product.name }} — {{ item.quantity }} шт. ({{ item.item_price }} BYN)</li>
            {% endfor %}
        </ul>
        <p><strong>Итого к оплате: {{ cart.total_price }} BYN</strong></p>
        <hr>

        <form method="POST" action="">
            {% csrf_token %}
            <div class="form-group">
                <label for="address">Адрес доставки *</label>
                <input type="text" id="address" name="address" placeholder="Минск, ул. Программистов, д. 10, кв. 8" required>
            </div>
            
            <div class="form-group">
                <label for="comment">Комментарий к заказу</label>
                <textarea id="comment" name="comment" rows="3" placeholder="Позвонить за час до доставки..."></textarea>
            </div>

            <button type="submit" class="btn-confirm">Подтвердить заказ и получить чек</button>
        </form>
    </div>

</body>
</html>
