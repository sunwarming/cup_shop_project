<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}CupStore | Магазин кружек{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        footer {
            background-color: #212529;
            color: #ccc;
        }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm mb-4">
        <div class="container">
            <a class="navbar-brand text-warning" href="/">
                <i class="bi bi-cup-hot-fill me-2"></i>CupStore
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">Главная</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/catalog/">Каталог</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/profile/">Личный кабинет</a>
                    </li>
                </ul>
                <div class="d-flex">
                    <a href="/admin/" class="btn btn-outline-warning btn-sm">
                        <i class="bi bi-shield-lock-fill me-1"></i>Админ-панель
                    </a>
                </div>
            </div>
        </div>
    </nav>

    <main class="min-vh-100">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="text-center py-4 mt-5">
        <div class="container">
            <p class="mb-1">&copy; 2026 CupStore. Все права защищены.</p>
            <small class="text-muted">Лабораторная работа по веб-программированию на Django</small>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function getCookie(name) {
            let cookieValue = null;
            if (document.cookie && document.cookie !== '') {
                const cookies = document.cookie.split(';');
                for (let i = 0; i < cookies.length; i++) {
                    const cookie = cookies[i].trim();
                    if (cookie.substring(0, name.length + 1) === (name + '=')) {
                        cookieValue = decodeURIComponent(cookie.substring(name.length + 1));
                        break;
                    }
                }
            }
            return cookieValue;
        }
        const csrftoken = getCookie('csrftoken');
    </script>

    {% block scripts %}
    {% endblock %}
</body>
</html>
