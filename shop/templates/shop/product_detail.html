<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ product.name }}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .product-container { max-width: 600px; background: #fff; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        .price { font-size: 20px; color: green; font-weight: bold; }
        .btn-add { display: inline-block; background-color: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; text-decoration: none; font-weight: bold; }
    </style>
</head>
<body>

    <p><a href="{% url 'product_list' %}">← Назад в каталог</a></p>

    <div class="product-container">
        <h1>{{ product.name }}</h1>
        <p><strong>Категория:</strong> {{ product.category.name }}</p>
        <p><strong>Производитель:</strong> {{ product.manufacturer.name }} ({{ product.manufacturer.country }})</p>
        <hr>
        <p><strong>Описание:</strong></p>
        <p>{{ product.description }}</p>
        <hr>
        <p class="price">Цена: {{ product.price }} BYN</p>
        <p>Доступно: {{ product.stock }} шт.</p>
        <br>
        <a href="{% url 'add_to_cart' product.id %}" class="btn-add">🛒 Положить в корзину</a>
    </div>

</body>
</html>
